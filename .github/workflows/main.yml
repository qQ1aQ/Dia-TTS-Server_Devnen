name: Build and Push Dia TTS Docker Image (Attempting Docker Hub Free)

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main # Optional: Trigger on pull requests to main
  workflow_dispatch: # Allows manual triggering

jobs:
  build_dia_image:
    runs-on: ubuntu-latest # Use a standard Ubuntu runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Use your Docker Hub username secret
          password: ${{ secrets.DOCKER_PASSWORD }} # Use your Docker Hub password/token secret

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: . # Build context is the root of the repository
          file: Dockerfile # <-- MODIFIED: Pointing to the Dockerfile in the root
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/Dia-TTS-Server_Devnen:latest # <-- MODIFIED: Defining the desired repository name on Docker Hub
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Echo Image Tag (for confirmation)
        run: echo "Attempted to build and push ${{ secrets.DOCKER_USERNAME }}/Dia-TTS-Server_Devnen:latest to Docker Hub Free."
